<!DOCTYPE html>
<title>overflow clips follow border-radius</title>
<style>
body { margin: 16px; background: #fff; font-size: 20px; color: #000 }
.clip { display: inline-block; width: 140px; height: 100px; margin: 0 16px 16px 0; overflow: hidden; background: #ddd; border: 4px solid #333; border-radius: 40px }
.big { width: 300px; height: 300px; background: #c33 }
#t { border-radius: 24px; border: 0; width: 150px; height: 60px; background: #eef }
#n { border-radius: 50px }
#n div { width: 100px; height: 60px; margin: 0 0 0 40px; overflow: hidden; border-radius: 20px; background: #36c }
#n .big { width: 200px; height: 200px; background: #393; margin: 0 }
</style>
<div class="clip"><div class="big"></div></div><div class="clip" id="t">Hello clipped text runs past the rounded edge</div><div class="clip" id="n"><div><div class="big"></div></div></div>
