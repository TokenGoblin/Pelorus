<!DOCTYPE html>
<title>svg: inline svg elements as replaced content, currentColor, sizing</title>
<style>
body { margin: 8px; font: 16px/1.2 "Noto Sans"; color: #222; background: #fff }
.row { margin: 0 0 10px 0 }
.ico { width: 32px; height: 32px; vertical-align: middle }
.blue { color: #1565c0 }
.red { color: #c62828 }
.boxed { display: block; border: 2px solid #455a64; padding: 4px; width: 120px; background: #eceff1 }
</style>
<div class="row">icons use currentColor:
  <svg class="ico" viewBox="0 0 24 24"><path d="M12 2 L22 12 L12 22 L2 12 Z" fill="currentColor"/></svg>
  <span class="blue"><svg class="ico" viewBox="0 0 24 24"><path d="M12 2 L22 12 L12 22 L2 12 Z" fill="currentColor"/></svg></span>
  <span class="red"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="3"/></svg></span>
  <svg class="ico" viewBox="0 0 24 24"><path d="M4 12 l5 5 l11 -11" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<div class="row">attribute sizes and style element:
  <svg width="120" height="60" viewBox="0 0 120 60"><style>.a { fill: #ff7043 } #b { fill: #26a69a }</style><rect class="a" x="4" y="4" width="50" height="52" rx="6"/><circle id="b" cx="86" cy="30" r="26"/></svg>
  <svg width="100" height="60" viewBox="0 0 50 30" preserveAspectRatio="xMinYMid slice" style="outline: 1px solid #ccc"><rect width="50" height="30" fill="#7e57c2"/><circle cx="25" cy="15" r="14" fill="#ede7f6"/></svg>
</div>
<div class="row">defs, use and gradient:
  <svg width="180" height="70" viewBox="0 0 180 70">
    <defs><linearGradient id="lg"><stop offset="0" stop-color="#ffd54f"/><stop offset="1" stop-color="#e64a19"/></linearGradient><g id="star"><polygon points="0,-14 4,-4 14,-4 6,3 9,13 0,7 -9,13 -6,3 -14,-4 -4,-4" fill="url(#lg)" stroke="#bf360c"/></g></defs>
    <use href="#star" x="25" y="35"/><use href="#star" x="70" y="35" transform="scale(1.4) translate(-20 -10)"/><use href="#star" x="140" y="35"/>
  </svg>
</div>
<span class="boxed"><svg width="100%" height="40" viewBox="0 0 100 40"><rect width="100" height="40" fill="#90caf9"/></svg></span>
