<!doctype html>
<meta charset="utf-8">
<title>web fonts: weight and style matching</title>
<style>
  /* One family, three faces: regular (hollow bars), bold (solid bars with caps),
     italic (slanted hollow bars). The shapes tell which face was chosen. */
  @font-face { font-family: 'Px Text'; font-weight: 400; src: url(@fonts/PxText-Regular.ttf); }
  @font-face { font-family: 'Px Text'; font-weight: 700; src: url(@fonts/PxText-Bold.woff2) format('woff2'); }
  @font-face { font-family: 'Px Text'; font-style: italic; src: url(@fonts/PxText-Italic.ttf); }
  body { margin: 16px; font: 32px/1.5 'Px Text', 'Noto Sans'; color: #1b1b1f; background: #fff; }
  p { margin: 0; }
  .k { font: 16px 'Noto Sans'; color: #555; }
</style>
<p>Hamburg 400 <span class="k">normal</span></p>
<p style="font-weight:700">Hamburg 700 <span class="k">bold</span></p>
<p style="font-weight:600">Hamburg 600 <span class="k">up to 700</span></p>
<p style="font-weight:300">Hamburg 300 <span class="k">down to 400</span></p>
<p style="font-weight:500">Hamburg 500 <span class="k">400 is the nearest</span></p>
<p style="font-style:italic">Hamburg ital <span class="k">italic</span></p>
<p style="font-style:italic;font-weight:700">Hamburg ital 700 <span class="k">style beats weight</span></p>
<p style="font-style:oblique">Hamburg obl <span class="k">oblique takes italic</span></p>
