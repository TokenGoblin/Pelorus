<!DOCTYPE html>
<title>Flex wrap</title>
<style>
body { margin: 0 }
#w { display: flex; flex-wrap: wrap; width: 400px; margin: 20px; background: #ddd }
#w div { width: 150px; height: 50px; margin: 5px }
#w div:nth-child(odd) { background: #c33 }
#w div:nth-child(even) { background: #36c }
</style>
<div id="w"><div></div><div></div><div></div><div></div><div></div></div>
