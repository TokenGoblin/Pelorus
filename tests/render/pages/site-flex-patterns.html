<!DOCTYPE html>
<title>Flex patterns real pages use</title>
<style>
body { margin: 0; background: #fff }
.r { display: flex; margin: 8px 16px; background: #eee; min-height: 40px }
.r > div { background: #9bd; border: 2px solid #357 }
.push { margin-left: auto }
.stretch { align-items: stretch }
.col { display: flex; flex-direction: column; height: 160px; width: 220px; float: left; margin: 8px 16px; background: #eee }
.col > div { background: #db9 }
.grow { flex: 1 }
.wrap { display: flex; flex-wrap: wrap; margin: 8px 16px; background: #eee; clear: both }
.wrap > div { flex: 1 1 200px; height: 30px; margin: 4px; background: #bd9 }
.pct > div { width: 25%; flex: none; height: 24px }
.cen { display: flex; justify-content: center; align-items: center; height: 80px; margin: 8px 16px; background: #eee }
.cen > div { width: 60px; height: 30px; background: #c77 }
.shrink > div { width: 400px; height: 20px }
</style>
<div class="r"><div style="width:100px;height:30px"></div><div class="push" style="width:100px;height:30px"></div></div>
<div class="r stretch"><div style="width:80px">a</div><div style="width:80px;height:60px"></div><div style="width:80px"></div></div>
<div class="col"><div style="height:30px"></div><div class="grow"></div><div style="height:30px"></div></div>
<div class="col"><div style="height:30px"></div><div style="align-self:center;width:50%;height:40px"></div><div style="align-self:flex-end;height:30px;width:80px"></div></div>
<div class="wrap"><div></div><div></div><div></div><div></div><div></div></div>
<div class="r pct"><div></div><div></div><div></div></div>
<div class="cen"><div></div></div>
<div class="r shrink"><div></div><div></div><div></div></div>
