<!DOCTYPE html>
<title>Table width distribution</title>
<style>
body { margin: 10px; font: 12px Ahem }
table { margin-bottom: 10px; border-spacing: 2px; background: #999 }
td { padding: 2px; background: #fd8 }
td.p { background: #8df } td.f { background: #8d8 }
</style>
<table style="width:700px"><tr><td>short<td>a much longer cell of text<td class="f" style="width:100px">fixed</table>
<table style="width:700px"><tr><td class="p" style="width:25%">25%<td>auto<td class="p" style="width:50%">50%</table>
<table style="width:700px;table-layout:fixed"><tr><td style="width:100px">first row sets it<td>x<td>y y y y y y y y y y y y y y y</table>
<table><tr><td>shrink<td>to fit</table>
