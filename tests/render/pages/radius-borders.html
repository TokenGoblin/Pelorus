<!DOCTYPE html>
<title>border-radius on borders</title>
<style>
body { margin: 16px; background: #fff }
div { display: inline-block; width: 120px; height: 80px; margin: 0 14px 14px 0; background: #eef }
#a { border: 2px solid #333; border-radius: 16px }
#b { border: 10px solid #c33; border-radius: 30px }
#c { border: 12px solid #06c; border-color: #c00 #0a0 #00c #c90; border-radius: 40px }
#d { border: 1px solid #000; border-radius: 40px }
#e { border-bottom: 8px solid #393; border-radius: 20px }
#f { border-left: 14px solid #906; border-top: 3px solid #069; border-radius: 30px 0 30px 0 }
#g { border: 8px solid rgba(0, 0, 0, 0.4); border-radius: 24px }
#h { border: 20px solid #639; border-radius: 12px }
#i { border: 5px solid #c60; border-radius: 60px / 30px }
#j { border: 4px solid #333; border-radius: 80px }
</style>
<div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div><div id="e"></div><div id="f"></div><div id="g"></div><div id="h"></div><div id="i"></div><div id="j"></div>
