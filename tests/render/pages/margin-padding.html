<!DOCTYPE html>
<title>Margin and padding</title>
<style>
body { margin: 0; background: #ddd }
#a { margin: 20px 50px; padding: 10px 40px; background: #36c }
#a div { background: #fc3; height: 50px }
#b { margin: 40px 50px 0 120px; padding: 25px; background: #c36 }
#b div { background: #fc3; height: 30px; margin: 10px 0 }
</style>
<div id="a"><div></div></div>
<div id="b"><div></div><div></div></div>
