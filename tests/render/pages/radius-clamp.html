<!DOCTYPE html>
<title>border-radius overlap clamping</title>
<style>
body { margin: 16px; background: #fff }
div { display: inline-block; margin: 0 16px 16px 0; background: #36c }
#a { width: 100px; height: 40px; border-radius: 100px }
#b { width: 100px; height: 40px; border-radius: 60px 60px 0 0; background: #c33 }
#c { width: 40px; height: 100px; border-radius: 30px 0 0 30px; background: #393 }
#d { width: 100px; height: 100px; border-radius: 80px 20px 80px 20px; background: #c60 }
#e { width: 100px; height: 60px; border-radius: 200px / 10px; background: #639 }
#f { width: 100px; height: 60px; border-radius: 500px; border: 10px solid #333; background: #eee }
#g { width: 90px; height: 90px; border-radius: 45px; background: #069 }
#h { width: 90px; height: 90px; border-radius: 0; background: #069 }
</style>
<div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div><div id="e"></div><div id="f"></div><div id="g"></div><div id="h"></div>
