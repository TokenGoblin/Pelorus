<!DOCTYPE html>
<title>Border sides</title>
<style>
body { margin: 20px }
div { width: 160px; height: 100px; margin-bottom: 20px; background: #eee }
#a { border-style: solid; border-width: 4px 12px 20px 28px; border-color: #c00 #0a0 #00c #c90 }
#b { border-top: 10px solid #333; border-bottom: 10px solid #999 }
#c { border-left: 16px solid #906; border-right: 2px solid #069; border-top: 0 none; }
#d { border: 3px solid #000 }
</style>
<div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div>
