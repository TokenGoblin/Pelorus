<!DOCTYPE html>
<title>Legacy table attributes, columns and nesting</title>
<body style="margin:20px;font:14px Ahem">
<table border="1" width="600" cellpadding="5" cellspacing="2" bgcolor="#ddeeff" align="center">
<colgroup><col style="background:#fcc"><col span="2" style="background:#cfc"></colgroup>
<tr><th width="100">H1<th>H2<th>H3</tr>
<tr><td align="right">r<td valign="top" height="50">t<td bgcolor="#ffee88">c</tr>
<tr><td colspan="2"><table border="2" cellpadding="3"><tr><td>in<td>ner</table><td nowrap>no wrap here</tr>
</table>
