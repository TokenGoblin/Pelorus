<!DOCTYPE html>
<title>Positioning, stacking and clipping patterns</title>
<style>
body { margin: 0; background: #fff }
.card { position: relative; width: 300px; height: 160px; margin: 16px; background: #eee; overflow: hidden }
.badge { position: absolute; top: 8px; right: 8px; width: 60px; height: 24px; background: #c33 }
.stretch { position: absolute; top: 40px; bottom: 10px; left: 10px; right: 10px; background: #9bd }
.out { position: absolute; left: 250px; top: 120px; width: 120px; height: 80px; background: #e93 }
.nocl { position: relative; width: 300px; height: 100px; margin: 16px; background: #eee }
.nocl .out { left: 250px; top: 60px }
.ctx { position: relative; z-index: 0; width: 200px; height: 100px; margin: 16px; background: #ddd }
.ctx .a { position: absolute; z-index: 100; left: 10px; top: 10px; width: 80px; height: 40px; background: #36c }
.sib { position: relative; z-index: 1; margin: -60px 0 0 60px; width: 200px; height: 50px; background: #c63 }
.mm { width: 200px; min-height: 60px; max-height: 40px; background: #6a6; margin: 16px }
.fl { overflow: hidden; margin: 16px; background: #ddd; width: 300px }
.fl > div { float: left; width: 100px; height: 40px; background: #a6c }
.abs-auto { position: absolute; top: 20px; right: 20px; background: #fc0 }
.abs-auto div { width: 70px; height: 30px }
</style>
<div style="position:relative">
<div class="card"><div class="badge"></div><div class="stretch"></div></div>
<div class="nocl"><div class="out"></div></div>
<div class="ctx"><div class="a"></div></div>
<div class="sib"></div>
<div class="mm"></div>
<div class="fl"><div></div><div></div></div>
<div class="abs-auto"><div></div></div>
</div>
