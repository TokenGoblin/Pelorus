<!DOCTYPE html>
<title>svg: images in img elements, intrinsic size, viewBox ratio, scaling</title>
<style>
body { margin: 8px; font: 16px/1.2 "Noto Sans"; color: #222; background: #fff }
.row { margin: 0 0 8px 0 }
img { vertical-align: top; outline: 1px solid #ccc }
.small { width: 48px }
.big { width: 144px }
</style>
<div class="row">intrinsic, smaller, larger (the ratio is kept):
  <img src="img/badge.svg" alt="badge"> <img class="small" src="img/badge.svg" alt="badge"> <img class="big" src="img/badge.svg" alt="badge"></div>
<div class="row">no width or height, viewBox ratio only (fits 300x150):
  <img src="img/chart.svg" alt="chart"></div>
<div class="row"><img src="img/paths.svg" alt="paths" width="200" height="160"> <img src="img/paths.svg" alt="paths" style="width: 120px; height: 96px"></div>
<div class="row">refused, alt shown: <img src="img/bomb.svg" alt="entity bomb refused"> <img src="img/use-bomb.svg" alt="use bomb refused"></div>
