<!DOCTYPE html>
<title>Grid with fr tracks</title>
<style>
body { margin: 0 }
#g { display: grid; grid-template-columns: 1fr 2fr 100px; grid-template-rows: 80px 1fr; width: 700px; height: 300px; margin: 30px; background: #ddd }
#g div { background: #36c }
#g .x { background: #c33; grid-column: 1 / 3 }
#g .y { background: #3c3 }
</style>
<div id="g"><div class="x"></div><div></div><div class="y"></div><div></div><div class="y"></div></div>
