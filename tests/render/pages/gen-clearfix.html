<!DOCTYPE html>
<title>Generated content: clearfix and decorative boxes</title>
<style>
body { margin: 0; background: #fff }
.row { background: #ddd; margin: 10px; padding: 5px }
.row::after { content: ""; display: table; clear: both }
.col { float: left; width: 100px; height: 40px; margin-right: 10px; background: #69c }
.bar { margin: 10px; padding: 0 0 0 20px; height: 30px; background: #eee; position: relative }
.bar::before { content: ""; display: block; position: absolute; left: 0; top: 0; width: 12px; height: 30px; background: #c96 }
.tag { margin: 10px; height: 24px; background: #cfc }
.tag::before { content: ""; float: left; width: 24px; height: 24px; margin-right: 6px; background: #393 }
.tag::after { content: ""; float: right; width: 60px; height: 24px; background: #9c9 }
.empty { margin: 10px; background: #fcc }
.empty::before { content: ""; display: block; height: 8px; background: #c33 }
.empty::after { content: ""; display: block; height: 8px; background: #933 }
</style>
<div class="row"><div class="col"></div><div class="col"></div><div class="col"></div></div>
<div class="bar"></div>
<div class="tag"></div>
<div class="empty"></div>
