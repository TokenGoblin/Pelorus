<!DOCTYPE html>
<title>Flex row</title>
<style>
body { margin: 0 }
#row { display: flex; width: 700px; height: 120px; margin: 30px; background: #ddd }
#row div { height: 80px }
#a { width: 100px; background: #c33 }
#b { flex: 1; background: #3c3 }
#c { flex: 2; background: #33c }
#d { width: 60px; background: #fc0; align-self: flex-end }
</style>
<div id="row"><div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div></div>
