<!DOCTYPE html>
<style>
body{margin:0}
.f{display:flex;height:80px;background:#eee;margin:10px}
.f>div{width:100px;height:60px}
.a{background:#c66;z-index:1}
.b{background:#6c6;margin-left:-50px}
.g{display:grid;grid-template-columns:100px 100px;height:80px;background:#eee;margin:10px}
.g>div{height:60px}
.g .a{grid-column:1;grid-row:1;background:#c66;z-index:1}
.g .b{grid-column:1;grid-row:1;background:#6c6;margin-left:30px}
.o{position:relative;width:200px;height:60px;margin:10px;background:#ddd;overflow:hidden}
.o .in{position:absolute;left:150px;top:20px;width:100px;height:100px;background:#69c}
.o2{width:200px;height:60px;margin:10px;background:#ddd;overflow:hidden}
.o2 .in{margin-left:150px;margin-top:20px;width:100px;height:100px;background:#c96}
.neg{position:relative;margin:10px;height:60px;background:#eee}
.neg .n{position:absolute;z-index:-1;left:20px;top:20px;width:80px;height:80px;background:#f99}
</style>
<div class="f"><div class="a"></div><div class="b"></div></div>
<div class="g"><div class="a"></div><div class="b"></div></div>
<div class="o"><div class="in"></div></div>
<div class="o2"><div class="in"></div></div>
<div style="position:relative;z-index:0"><div class="neg"><div class="n"></div></div></div>
