<!DOCTYPE html>
<title>Text paragraph</title>
<style>
body { margin: 0; background: #fff }
p { margin: 20px; width: 360px; color: #204060; font-size: 16px }
h1 { margin: 20px; font-size: 32px; color: #802040 }
</style>
<h1>Heading text</h1>
<p>The quick brown fox jumps over the lazy dog and keeps running across the page until the line has to wrap.</p>
<p style="font-size: 24px; color: #006600">Larger text in a second paragraph.</p>
