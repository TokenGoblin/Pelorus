# build-spec §4.3 denies unwrap, expect, panic and indexing in the crates that
# handle hostile input. Those denials are about shipping code: a test asserting
# a decoder rejects a hostile frame has to be able to say `expect` and
# `panic!("expected X, got {y}")`, and writing that assertion three lines longer
# to satisfy a lint makes the test worse without making the binary safer.
#
# CLAUDE.md's hard rule is "do not add allow attributes to get around it", and
# this is deliberately not that. It is one workspace-level, reviewable statement
# of where the boundary is, rather than waivers scattered at call sites where
# nobody can count them. ci/gate-unsafe-headers.sh still fails any per-site
# allow() of these lints, so the only way to widen this is to edit this file, in
# a diff, on purpose.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
