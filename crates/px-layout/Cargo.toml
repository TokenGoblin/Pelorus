[package]
name = "px-layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# §4.2 names Au by description -- "app units, i32 at 1/60 px, as Servo and Gecko
# do" -- and app_units is that type. Already in the closure via stylo, and named
# directly by px-css, so this adds no crate to the tree. Same version, for the
# reason the toml dev-dependency taught: reaching for the newest resolves a second
# copy and doubles the audit surface for nothing.
app_units = "0.7.8"
# Layout reads computed style, which is px-css's job, and walks the DOM the style
# was computed against. Same versions the rest of the workspace resolves.
px-css = { path = "../px-css", version = "0.0.0" }
px-dom = { path = "../px-dom", version = "0.0.0" }
stylo = { version = "0.21.0", default-features = false, features = ["servo"] }

