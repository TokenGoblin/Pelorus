[package]
name = "px-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "px_broker"
path = "src/lib.rs"

[[bin]]
name = "px-browser"
path = "src/main.rs"

[dependencies]
# Version alongside path: cargo-deny treats a bare path dependency as a
# wildcard, and "any version at all" is not a supply-chain position.
px-ipc = { path = "../px-ipc", version = "0.0.0" }
