[package]
name = "px-paint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# ADR 033: paint reads layout's geometry type and nothing else third-party.
# `Au` is the one geometry type in the project (build-spec 4.2).
px-layout = { path = "../px-layout", version = "0.0.0" }
# The display-list builder reads computed style (through `px_css::paint`, which
# hands out plain data, no stylo type) and the DOM the fragments point into.
# Workspace crates only: no third-party crate is added to the tree, and
# `app_units::Au` still arrives through `px_layout::geom`.
px-css = { path = "../px-css", version = "0.0.0" }
px-dom = { path = "../px-dom", version = "0.0.0" }

[dev-dependencies]
# Glyph-run tests draw real Ahem glyphs. px-text is a workspace path: no
# third-party crate is added, and px-text does not depend on px-paint, so there
# is no cycle. The library itself does not depend on it (it reads outlines
# through `raster::GlyphSource`).
px-text = { path = "../px-text", version = "0.0.0" }
