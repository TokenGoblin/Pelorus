[package]
name = "px-paint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# ADR 033: paint reads layout's geometry type and nothing else third-party.
# `Au` is the one geometry type in the project (build-spec 4.2).
px-layout = { path = "../px-layout", version = "0.0.0" }
