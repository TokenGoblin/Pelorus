[package]
name = "px-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "px_gpu"
path = "src/lib.rs"

[[bin]]
name = "px-gpu"
path = "src/main.rs"

[dependencies]
# Workspace paths only: no new third-party crate (ADR 033, ADR 034). px-layout
# is named for `Au`, the one geometry type in the project, which the display
# list is written in.
px-ipc = { path = "../px-ipc", version = "0.0.0" }
px-layout = { path = "../px-layout", version = "0.0.0" }
px-paint = { path = "../px-paint", version = "0.0.0" }
# Stage two of the GPU profile (the process confines itself after startup) and
# the verification of it live in the one crate permitted unsafe (ADR 008).
px-sandbox = { path = "../px-sandbox", version = "0.0.0" }

[dev-dependencies]
# The boundary tests need the testing vocabulary (probe, fault injection) in
# both the test and the `px-gpu` binary it spawns. A crate naming itself as a
# dev-dependency with a feature is how `cargo test` turns that feature on for
# the package's own binary without a flag, so a plain `cargo test --workspace`
# runs these tests instead of compiling them away.
px-gpu = { path = ".", features = ["testing"] }
# The session-state half of the fallback gate: a broker's frame tree and
# channels are untouched by a GPU process dying.
px-broker = { path = "../px-broker", version = "0.0.0" }

[features]
# §14.4: the probe of forbidden operations and the fault injection exist only
# under this feature, are scanned for in release artifacts, and are enabled
# end to end (vocabulary, process, sandbox probe) by one switch.
testing = ["px-ipc/testing", "px-sandbox/testing"]
