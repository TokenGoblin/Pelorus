[package]
name = "px-content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "px-content"
path = "src/main.rs"

[dependencies]
px-ipc = { path = "../px-ipc", version = "0.0.0" }

[dev-dependencies]
# The crash-and-restart gate needs both a real broker and a real content
# process binary. CARGO_BIN_EXE_px-content is only set for this package's own
# tests, so the end-to-end test lives here and pulls the broker in, rather than
# living in px-broker and hunting for the binary on disk.
px-broker = { path = "../px-broker", version = "0.0.0" }

# The refusal test drives the capability ladder directly, so it needs the
# crate that owns it and the test-only override behind its feature.
px-sandbox = { path = "../px-sandbox", version = "0.0.0" }

[features]
# §14.4: forwards to px-sandbox, whose PX_TEST_FORCE_SANDBOX_UNAVAILABLE
# override must not exist in a release artifact.
testing = ["px-sandbox/testing"]

# build-spec §4.3: this crate handles hostile input.
[lints]
workspace = true
