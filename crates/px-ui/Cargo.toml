[package]
name = "px-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Workspace crates only; no third-party crate (and no windowing crate: ADR 044 is
# undecided, see `platform`). px-paint is the display list and the software
# rasterizer the chrome is drawn with; px-layout supplies its `Au` unit; px-brand
# the palette and every user-visible string.
px-brand = { path = "../px-brand", version = "0.0.0" }
px-layout = { path = "../px-layout", version = "0.0.0" }
px-paint = { path = "../px-paint", version = "0.0.0" }

[dev-dependencies]
# The render baselines draw real glyphs; the library reaches fonts only through
# its `TextShaper` trait. px-text is a workspace path, not a new crate.
px-text = { path = "../px-text", version = "0.0.0" }
