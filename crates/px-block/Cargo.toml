[package]
name = "px-block"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Phase 19. First-party only; no third-party crate is added (CLAUDE.md: no new
# dependency without an ADR).
#
# px-websec is std-only (its Cargo.toml says so) and does not depend on
# px-block, so this edge adds no crate to the closure and cannot form a cycle.
# It supplies the URL and origin types, the `SiteResolver` trait (so the
# public suffix list stays px-net's and px-block does not pull rustls), and
# the referrer-policy computation.
px-websec = { path = "../px-websec", version = "0.0.0" }

# This crate parses untrusted filter-list text (build-spec §4.3).
[lints]
workspace = true
