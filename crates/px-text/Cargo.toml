[package]
name = "px-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# ADR 036 (accepted 2026-11-04) is the authorisation for every line below.
#
# The shaper: harfrust (a HarfBuzz port, no `unsafe`) over skrifa's font
# reader. `default-features = false` and `std` only: no `icu` feature (ICU is
# reached directly where needed), no `libm`, no `tracing`.
harfrust = { version = "0.15.0", default-features = false, features = ["std"] }
skrifa = { version = "0.49.0", default-features = false, features = ["std"] }
# UAX #14 line breaking and UAX #29 graphemes. Already in Cargo.lock through
# stylo and url at this version, so this line adds no crate. Default features
# are the ones the lock already compiles (compiled_data; auto, which brings the
# LSTM models for Thai, Lao, Khmer and Myanmar).
icu_segmenter = "2.3.0"
