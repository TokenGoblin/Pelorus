[package]
name = "px-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# Deliberately outside the workspace. It is built by a different toolchain
# (ADR 006), never shipped, and must not appear in the workspace lockfile that
# the reproducibility gate depends on.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `testing` so the GPU vocabulary's probe and fault variants are fuzzed too.
px-ipc = { path = "../crates/px-ipc", features = ["testing"] }
px-broker = { path = "../crates/px-broker" }
px-net = { path = "../crates/px-net" }
# `testing` for Arena::force_generation_to_last: §14.3 asks for a target
# that forces generation exhaustion, and ADR 018 chose a layout where four
# billion generations makes it unreachable by churn.
px-dom = { path = "../crates/px-dom", features = ["testing"] }
# Phase 9: the shaper parses untrusted font bytes (ADR 036).
px-text = { path = "../crates/px-text" }
# Phase 12: the CSP parser reads attacker-controlled headers.
px-websec = { path = "../crates/px-websec" }
# Phase 15: PNG, GIF, JPEG, BMP and ICO decoders of untrusted image bytes (ADR 042).
px-image = { path = "../crates/px-image" }
# Phase 19: filter lists are untrusted text through the px-block parser.
px-block = { path = "../crates/px-block" }
# Phase 11: the WebIDL parser and generator sit in the build chain.
px-bindings = { path = "../crates/px-bindings" }
# Phase 16: the accessibility tree is built from attacker-controlled markup.
px-a11y = { path = "../crates/px-a11y" }
# Phase 20: the update manifest, signature file and Ed25519 verifier read
# attacker-controlled bytes.
px-update = { path = "../crates/px-update" }

[[bin]]
name = "frame_request"
path = "fuzz_targets/frame_request.rs"
test = false
doc = false
bench = false

