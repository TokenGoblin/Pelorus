# cargo-deny policy (build-spec §5).
#
# Validated: cargo-deny runs locally and in CI, and this file has been parsed
# and enforced. The Phase 0 note saying otherwise is removed rather than left
# to read as a live warning.

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# The closure build-spec §3 permits: html5ever, stylo, rustls, swash,
# cosmic-text, wgpu, image, boa_engine, postcard, url, idna, and what they
# pull. MPL-2.0 is here because stylo is Gecko-derived. Anything not on this
# list stops the build and needs an ADR, which is the point.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    # ADR 016. webpki-roots ships Mozilla's root store, and a *data* set
    # carries a data licence rather than a code one. CDLA-Permissive-2.0 is
    # permissive with no copyleft and no attribution burden on binaries; it is
    # here for that one crate and its addition is a decision, not a widening
    # of the code licence policy above.
    "CDLA-Permissive-2.0",
]
exceptions = []
# Our own crates carry no `license` field, deliberately: the licence is open
# decision 9 in build-spec §13 and settling it by typing a default here would
# be settling it by accident. They are all `publish = false`, so cargo-deny
# treats them as private and does not ask. Delete this the day decision 9 is
# made and the field is filled in.
private = { ignore = true }

[bans]
# Duplicate versions of a crate mean duplicate unsafe, duplicate audit surface
# and duplicate patching at a CVE. Denied, with skips added deliberately and
# with a reason rather than tolerated silently.
multiple-versions = "deny"
wildcards = "deny"
deny = []
# Each skip is a duplicate somebody decided to accept, with the reason.
skip = [
    # ADR 016. Two windows-sys: px-sandbox uses 0.61, and ring reaches 0.52
    # through getrandom. Not ours to unify — the pin is inside a dependency's
    # dependency, and forcing it would mean patching or forking ring for a
    # version bump that buys nothing.
    #
    # The cost is real and is the reason this list is not empty by default:
    # two copies mean two audit surfaces and two crates to patch at a CVE.
    # 0.52 is 3,411 unsafe tokens against 0.61's 12,530, both of them
    # generated FFI declarations, and both publishers are the same trusted
    # one. Revisit when getrandom or ring moves.
    { name = "windows-sys" },
    # ADR 023, the stylo closure. Two syn: 2.0 is what most proc-macro crates
    # still build against, and 3.0 arrives through a newer one in stylo's own
    # dependency graph.
    #
    # Accepted on a narrower ground than the windows-sys skip above, and worth
    # distinguishing: syn is a **build-dependency**. Neither copy is linked into
    # any shipping binary, so "two audit surfaces and two crates to patch at a
    # CVE" -- the cost that makes this list uncomfortable -- applies to the build
    # host rather than to the product. It is still not nothing: a compromised
    # proc-macro runs arbitrary code at compile time, which is why this is a skip
    # with a reason and not a relaxation of `multiple-versions`.
    #
    # It is also not ours to unify: both pins are inside dependencies of
    # dependencies. Revisit when the 2.x holdouts in the stylo graph move, which
    # costs nothing to check at each stylo bump -- and ADR 023 already requires a
    # TElement review at every bump, so there is a natural place to look.
    { name = "syn" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# A git dependency is a dependency on a moving target with no audit story.
# Empty, and an addition needs an ADR.
allow-git = []
