# TEMPORARY diagnostic for ci/windows-green; deleted before the branch is done.
name: win-diag
on:
  push:
    branches: [ci/windows-green]
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build content binary
        shell: bash
        run: cargo build --locked -p px-content -p px-xtask
      - name: Diagnose
        shell: bash
        run: |
          export PX_DIAG_CONTENT="$(cygpath -w "$(pwd)/target/debug/px-content.exe");$(cygpath -w "$(pwd)/target/debug/px-xtask.exe")"
          echo "$PX_DIAG_CONTENT"
          ls -la target/debug/*.exe
          cargo test --locked -p px-sandbox windows_diag_content_start -- --nocapture --test-threads=1
