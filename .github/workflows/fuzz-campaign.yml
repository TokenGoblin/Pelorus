# The 24-hour fuzzing campaign Phase 1's gate requires (ADR 006).
#
# Scheduled and on demand, never on push. A gate that takes a day to report is a
# gate that gets bypassed within a fortnight, so the push path runs a 60-second
# smoke and this runs the real thing.
#
# WHY THIS IS A MATRIX AND NOT ONE LONG JOB: a GitHub-hosted job is killed at
# six hours. "Fuzz clean for 24h" therefore cannot be a single run, and writing
# it as one would have produced a job that is cancelled every week and a gate
# nobody could ever satisfy. Sharding gives the campaign its 24 hours as
# targets x shards x hours-per-shard, in parallel, each job well inside the
# limit.
#
#   20 shards x 4 hours = 80 hours of fuzzing, ~4 hours of wall clock
#
#   Per target, which is what the gate items are written against:
#     dom_mutation     6 x 4h = 24h   (§9 Phase 4)
#     dom_parse        3 x 4h = 12h
#     dom_stale_handle 2 x 4h =  8h
#     http_response    2 x 4h =  8h
#     the rest         1 x 4h =  4h each
#
# Shards are not redundant: libFuzzer seeds from the clock and its own corpus,
# so three shards of one target explore different paths rather than repeating
# the same one. They share the committed corpus as a starting point and their
# findings are unioned by whoever commits the reproducer.
#
# A crash here is a defect: file it, fix it, and commit the reproducing input to
# fuzz/corpus so the smoke job catches its regression in sixty seconds.

name: fuzz-campaign

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds_per_shard:
        description: Seconds per shard (4h default; 5h ceiling, see timeout-minutes)
        required: false
        default: "14400"

permissions:
  contents: read

jobs:
  campaign:
    name: ${{ matrix.target }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Inside the six-hour hosted-runner limit with room for the toolchain and
    # cargo-fuzz install, which run before the fuzzing starts. Anything above
    # 18000 seconds per shard will be cancelled by this timeout rather than
    # finishing, so that is the real ceiling for the input above.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        # Weighted towards the hostile direction and the properties that
        # matter. frame_response is the direction whose own documentation says
        # it matters less, and it used to get half the budget.
        #
        # Phase 3 adds the HTTP framing targets, which §9 requires fuzzed for
        # 24h. They get three shards between them because they are the newest
        # parsers here and the only ones reachable by any server the user
        # connects to — the IPC targets face a content process the broker
        # already spawned, which is a smaller population of attackers.
        include:
          - { target: frame_request, shard: 1 }
          - { target: channel_stream, shard: 1 }
          - { target: channel_stream, shard: 2 }
          - { target: broker_sequence, shard: 1 }
          - { target: frame_response, shard: 1 }
          - { target: http_response, shard: 1 }
          - { target: http_response, shard: 2 }
          - { target: http_chunked, shard: 1 }
          # Phase 4. §9 requires 24h of mutation fuzzing and a stale-handle
          # target. Two shards for dom_mutation because it is the one checking
          # a structural property rather than a decoder, and its input space is
          # operation sequences rather than bytes, which is larger than it
          # looks. See ci/gate-fuzz-smoke.sh for why their -max_len is 4 KB
          # rather than the megabyte the parsers get.
          #
          # dom_mutation gets six shards because §9 Phase 4's gate item is
          # "24h mutation fuzz clean" and six times four hours is twenty-four
          # CPU-hours of *that target*. Two shards would give eight, and the
          # campaign total would still read "44 hours" -- which is true of the
          # campaign and not of the item. Counting the whole campaign against a
          # per-target item is how a gate gets satisfied on paper; six shards
          # costs an afternoon of runner time and removes the question.
          #
          # dom_stale_handle gets two: §4.1 asks for the target to exist and
          # prove the property, not for a day of it.
          - { target: dom_stale_handle, shard: 1 }
          - { target: dom_stale_handle, shard: 2 }
          - { target: dom_mutation, shard: 1 }
          - { target: dom_mutation, shard: 2 }
          - { target: dom_mutation, shard: 3 }
          - { target: dom_mutation, shard: 4 }
          - { target: dom_mutation, shard: 5 }
          - { target: dom_mutation, shard: 6 }
          # The parser. §4.4 asks for 100,000-level nesting in the corpus of
          # every parser, and this is the only target that sends HTML through
          # html5ever and the TreeSink -- the surface a page actually reaches.
          - { target: dom_parse, shard: 1 }
          - { target: dom_parse, shard: 2 }
          - { target: dom_parse, shard: 3 }
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Campaign
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_SECONDS: ${{ github.event.inputs.seconds_per_shard || '14400' }}
        run: ci/gate-fuzz-smoke.sh
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}-${{ matrix.shard }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
