# The 24-hour fuzzing campaign Phase 1's gate requires (ADR 006).
#
# Scheduled and on demand, never on push. A gate that takes a day to report is
# a gate that gets bypassed within a fortnight, so the push path runs a 60s
# smoke instead and this runs the real thing.
#
# A crash here is a defect: file it, fix it, and commit the reproducing input to
# fuzz/corpus so the smoke job catches its regression in sixty seconds.

name: fuzz-campaign

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds_per_target:
        description: Seconds per target
        required: false
        default: "86400"

permissions:
  contents: read

jobs:
  campaign:
    name: campaign
    runs-on: ubuntu-latest
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Campaign
        env:
          FUZZ_SECONDS: ${{ github.event.inputs.seconds_per_target || '86400' }}
        run: ci/gate-fuzz-smoke.sh
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
