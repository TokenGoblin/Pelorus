# Phase gate. Every check here is a script under ci/ or tests/ that runs
# identically on a developer machine — CI invokes the gate, it does not define
# it. A gate you cannot reproduce locally is one you will learn to ignore.
#
# Phase 0 gate (build-spec §9):
#   1. builds on both OSes                     -> build
#   2. hashes reproducible across machines     -> reproducible
#   3. supply-chain checks green               -> supply-chain
#   4. forbid(unsafe_code) everywhere          -> unsafe-headers
#   5. brand-leak gate proven by a violation   -> brand-leak
#
# Jobs that read source text rather than build it run on Linux only; running a
# grep twice on two operating systems buys nothing and hides which checks are
# genuinely platform-sensitive.

name: gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        shell: bash
        run: rustc --version && cargo --version
      - name: Gate check 1
        shell: bash
        run: cargo xtask build

  reproducible:
    name: reproducible (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The gate tool is built once, here, under the runner's own HOME and
      # CARGO_HOME, and the builds below run the binary directly. `cargo xtask`
      # would have to compile it again under each moved HOME (and, for build B,
      # as a second user); the tool is not part of what is being hashed, and
      # the scratch builds below never see this target directory.
      - name: Build gate tool
        shell: bash
        run: cargo build --locked -p px-xtask

      # Build A and build B differ in checkout path, HOME and CARGO_HOME. On
      # Linux they additionally run as different users, which is the condition
      # the gate names. On Windows a second interactive account is not
      # practical on a hosted runner; that gap is recorded in the gate report
      # rather than papered over, and the two runs still differ in path, HOME
      # and CARGO_HOME.
      - name: Build A
        shell: bash
        run: |
          # Resolve the toolchain location BEFORE moving HOME. rustup finds its
          # toolchains under $HOME/.rustup unless RUSTUP_HOME says otherwise, so
          # a moved HOME with no RUSTUP_HOME means the cargo shim resolves to
          # nothing. The two builds must share one toolchain anyway: invariant 7
          # is same source plus same toolchain, not same everything.
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          # RUNNER_TEMP is a native path on Windows; every tool below is POSIX.
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")"
          export HOME="$TMP/home-a"
          export CARGO_HOME="$HOME/.cargo"
          mkdir -p "$CARGO_HOME"
          target/debug/px-xtask build-and-hash "$TMP/short" > "$TMP/a.txt"
          cat "$TMP/a.txt"

      - name: Build B (different user)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          sudo useradd -m -s /bin/bash builder2
          # builder2 needs to read the shared toolchain out of the runner's home.
          chmod 0755 "$HOME"
          sudo mkdir -p /home/builder2/work
          sudo cp -r "$GITHUB_WORKSPACE" /home/builder2/work/a-considerably-longer-path
          sudo chown -R builder2:builder2 /home/builder2
          sudo -u builder2 env \
            HOME=/home/builder2 \
            CARGO_HOME=/home/builder2/.cargo \
            RUSTUP_HOME="$RUSTUP_HOME" \
            PATH="$PATH" \
            bash -c 'cd /home/builder2/work/a-considerably-longer-path && target/debug/px-xtask build-and-hash /home/builder2/work/build-b' \
            > "$RUNNER_TEMP/b.txt"
          cat "$RUNNER_TEMP/b.txt"

      - name: Build B (different path)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")"
          export HOME="$TMP/home-b-with-a-longer-name"
          export CARGO_HOME="$HOME/.cargo"
          mkdir -p "$CARGO_HOME"
          target/debug/px-xtask build-and-hash "$TMP/a/considerably/deeper/path" > "$TMP/b.txt"
          cat "$TMP/b.txt"

      - name: Gate check 2
        shell: bash
        run: |
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")"
          cargo xtask compare-hashes "$TMP/a.txt" "$TMP/b.txt"

  supply-chain:
    name: supply-chain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Installed from source with --locked rather than through a third-party
      # installer action. These tools sit in the trust path of a security
      # project; adding a marketplace action to save four minutes would be the
      # exact trade the working agreement exists to refuse.
      - name: Install audit tools
        shell: bash
        run: cargo install --locked cargo-deny cargo-vet cargo-auditable
      - name: Gate check 3
        shell: bash
        run: cargo xtask supply-chain

  unsafe-headers:
    name: unsafe-headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate check 4
        run: cargo xtask unsafe-headers

  brand-leak:
    name: brand-leak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate check 5
        run: cargo xtask brand-leak

  progress:
    name: progress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README progress chart is current
        run: cargo xtask progress

  # Phase 1 gate: identity rejection, crash recovery, size limits, and the
  # second build profile from ADR 004. Runs on both platforms — process spawn,
  # pipe behaviour and process death are exactly where the two diverge.
  ipc:
    name: ipc (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Phase 1 gate
        shell: bash
        run: cargo xtask ipc

  # Phase 2 gate: a policy is applied, refusal below the floor is real and
  # says why, the ladder is documented, and no test-only capability reaches a
  # release artifact (§14.4, pulled forward — this phase introduces the first).
  sandbox:
    name: sandbox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Phase 2 gate
        shell: bash
        run: cargo xtask sandbox

  # Phase 3. Written failing before px-net exists, and expected to stay red for
  # the length of the phase — a gate added only once it passes has never been
  # seen to fail, which is the one thing a gate has to be able to do.
  network:
    name: network (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # `continue-on-error: true` lived here while Phase 3 was open and outlived it
    # by three phases. Phase 5 recorded that in docs/backlog.md when it removed the
    # same line from the style job; Phase 6 rediscovered it from scratch, removing
    # the same line from the layout job, and filed a duplicate before noticing.
    # Two phases deferred it as out-of-phase, correctly, and the effect was that a
    # green job nobody owned stayed unenforced. Deleted on the third encounter.
    steps:
      - uses: actions/checkout@v4
      - name: Phase 3 gate
        shell: bash
        run: cargo xtask network

  # build-spec §4.5, ADR 022. Miri over px-dom, on the nightly ADR 006 pins.
  #
  # Linux only, deliberately: Miri is a slow interpreter and the thing it is
  # checking here is dependency unsafe, which is not platform-specific.
  # Doubling the cost to run it twice would buy very little.
  miri:
    name: miri (px-dom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned nightly and miri
        shell: bash
        run: |
          nightly="$(grep -oE 'nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}' fuzz/rust-toolchain.toml | head -1)"
          rustup toolchain install "$nightly" --component miri --profile minimal
      - name: Miri
        shell: bash
        run: cargo xtask miri

  # Phase 4. Written failing before px-dom had an arena, and red for the length
  # of the phase — a gate added only once it passes has never been seen to
  # fail, which is the one thing a gate has to be able to do.
  #
  # Now required. It went green when the conformance runner landed, so
  # `continue-on-error` is gone: a job that is allowed to fail and does not is
  # no longer telling anybody anything.
  #
  # The conformance figure it grades sets two causes aside — see ADR 019 — and
  # prints both that figure and the unadjusted one, so a green tick here and a
  # 94.62% in the log are reconcilable from the output rather than only from
  # the ADR.
  dom:
    name: dom (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Phase 4 gate
        shell: bash
        run: cargo xtask dom

  # Phase 5. Required, as of the phase's last commit.
  #
  # `continue-on-error: true` was set from the phase's first commit and removed
  # here, which is the whole lifecycle of that line: a job allowed to fail while
  # the phase is open tells you the phase is in progress, and one still allowed to
  # fail after it closes tells you nothing at all.
  #
  # Wired to CI from day one rather than added at the end, because Phase 4's gate
  # spent five commits red in CI while three commit messages said it was green. A
  # gate whose CI behaviour is first exercised on the last day is a gate that
  # fails on the last day.
  style:
    name: style (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # fetch-depth matters: `cargo xtask style` resolves ADR 021's tripwire by
      # comparing two px-dom test files against pinned blob hashes through
      # `git rev-parse HEAD:<path>`, which needs the objects present. A shallow
      # checkout of one commit still has them, but a sparse one would not.
      - name: Phase 5 gate
        shell: bash
        run: cargo xtask style

  # Phase 6, and red on purpose until the phase closes.
  #
  # `continue-on-error: true` was set from the phase's first commit and removed
  # here, in its last: wired from day one so the gate's CI behaviour was exercised
  # all along rather than discovered on the closing day, which is the lesson
  # Phase 4 paid for. Phase 6 is closed; this job is now required.
  layout:
    name: layout (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Phase 6 gate
        shell: bash
        run: cargo xtask layout

  # Phase 7 gate (`cargo xtask flex-grid`). `continue-on-error` is set in the phase's
  # first commit and must be deleted in its last, so the gate's CI behaviour is
  # exercised all along rather than discovered on the closing day. It fails by
  # design until the flex and grid reftest suites exist.
  flex-grid:
    name: flex-grid (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Phase 7 gate
        shell: bash
        run: cargo xtask flex-grid

  # Phase 8 gate, render half (`cargo xtask render`). `continue-on-error` is set in
  # the phase's first commit and must be deleted in its last, so the gate's CI
  # behaviour is exercised all along rather than discovered on the closing day.
  # Running on both operating systems is the cross-platform determinism test: one
  # baseline set, tolerance zero (ADR 033 (b)).
  render:
    name: render (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Phase 8 render gate
        shell: bash
        run: cargo xtask render

  # Phase 10 gate (`cargo xtask script`). `continue-on-error` is set in the phase's
  # first commit and must be deleted in its last, so the gate's CI behaviour is
  # exercised all along rather than discovered on the closing day. It fails by
  # design until units 4 to 7 (limits, test262, fixtures, report) exist; the gate
  # prints them as "remaining". px-content builds twice (ADR 004) and Boa adds 73
  # crates to each build, so record this job's time when unit 1 first runs.
  script:
    name: script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Phase 10 gate
        shell: bash
        run: cargo xtask script

  # ADR 011: sanitizers over the audited unsafe core. The second and only other
  # consumer of the nightly ADR 006 fences to fuzz/ — same pinned version, named
  # explicitly rather than by directory override, so the fence assertion in
  # `cargo xtask fuzz-smoke` keeps passing unmodified and keeps meaning what it
  # meant. Nothing built here ships.
  sanitizers:
    name: sanitizers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Named explicitly here because `cargo +toolchain` does not provision on
      # first use the way a rust-toolchain.toml override does. The version is
      # read from fuzz/rust-toolchain.toml rather than written again: two pins
      # that can drift apart would be two nightlies, which ADR 011 says it will
      # not create.
      - name: Install the pinned nightly
        shell: bash
        run: |
          NIGHTLY="$(grep '^channel' fuzz/rust-toolchain.toml | cut -d'"' -f2)"
          echo "pinned nightly: $NIGHTLY"
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
      # Before trusting a clean run, prove the sanitizer can still fail. A green
      # sanitizer that cannot detect a fault converts an absence of evidence
      # into apparent assurance, which is worse than not running one.
      - name: Sanitizer is armed
        shell: bash
        run: cargo xtask sanitizers --self-check
      - name: ASAN and TSAN
        shell: bash
        run: cargo xtask sanitizers

  # ADR 006: 60s per target against the committed corpus. The 24h campaign
  # Phase 1's gate requires is .github/workflows/fuzz-campaign.yml, on a
  # schedule, because a day-long job on every push is a job that gets bypassed.
  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo-fuzz is Linux and macOS only in practice: libFuzzer is not
      # supported on the MSVC target. That is why this job has no matrix, and
      # why the deserializers are also exercised by ordinary tests, which do
      # run on both platforms.
      #
      # No explicit toolchain install: rustup provisions the nightly named in
      # fuzz/rust-toolchain.toml, with its components, on first use inside that
      # directory. Naming it again here would be a second place to update.
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Smoke
        run: cargo xtask fuzz-smoke

  # Not one of the five gate checks: a Phase 0 deliverable that only the
  # person who will daily-drive the browser can produce. Red here means the
  # list is outstanding, not that the phase gate failed.
  compat-list:
    name: compat-list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forty-site compat list
        run: cargo xtask compat-list

  structure:
    name: structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository structure invariants
        run: cargo xtask structure

  # ADR 032: the project is 100% Rust. Fails on any first-party non-Rust source
  # that is not on crates/px-xtask/all-rust-allowlist.txt, and on any stale
  # entry (the list may only shrink). Both platforms: the gate itself must run
  # where the project does.
  all-rust:
    name: all-rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: 100% Rust ratchet
        run: cargo xtask all-rust

  # Phase 10. Written before the engine is bound, so it is inert on purpose:
  # `continue-on-error: true` is set from the unit's first commit and comes off
  # in the phase's last, once `--engine` names a real engine and
  # tests/test262/RESULTS records a baseline. Until then the job proves the
  # vendored corpus is intact and the ratchet runs. Both platforms, because the
  # corpus is byte-exact and must survive a Windows checkout unchanged.
  test262:
    name: test262 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: test262 subset ratchet
        shell: bash
        run: cargo xtask test262
