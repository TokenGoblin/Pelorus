[workspace]
resolver = "3"
# Listed, not globbed. A crate that appears on disk without appearing here is
# a crate nobody decided to add.
members = [
    "crates/px-a11y",
    "crates/px-bindings",
    "crates/px-block",
    "crates/px-brand",
    "crates/px-broker",
    "crates/px-content",
    "crates/px-css",
    "crates/px-display",
    "crates/px-dom",
    "crates/px-gpu",
    "crates/px-image",
    "crates/px-ipc",
    "crates/px-layout",
    "crates/px-mcp",
    "crates/px-net",
    "crates/px-pages",
    "crates/px-paint",
    "crates/px-sandbox",
    "crates/px-script",
    "crates/px-shell",
    "crates/px-store",
    "crates/px-text",
    "crates/px-ui",
    "crates/px-update",
    "crates/px-websec",
    "crates/px-xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false
# No `license` field: the licence is open decision 9 in build-spec §13, due
# with the Phase 20 release decision. An unconsidered "MIT OR Apache-2.0"
# here would settle it by accident.

# build-spec §4.3. Applied via `[lints] workspace = true` by px-content, px-net,
# px-mcp — and px-ipc, which §4.3 does not name but which decodes bytes written
# by a process an attacker may fully control. The broker unwinds and is allowed
# to; the crates that parse hostile input are not.
#
# `cargo xtask unsafe-headers` scans this same set for per-site allow() waivers.
# Adding a crate here means adding it there.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

# Dev and test builds. Debug info for the whole dependency closure (stylo, Boa,
# rustls) made every integration-test binary over 100 MB and the shared target
# directory over 25 GB, which filled the build machine's quota three times in one
# session and killed three parallel builds partway. Line tables for our own
# crates keep backtraces readable; dependencies get none. This touches only the
# dev/test profiles: release, content-release and every reproducibility claim
# (invariant 7) are unaffected, and nothing shipped is built from them.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The image decoders' hostile-input tests decode every fixture thousands of
# times (truncate and corrupt at every byte). Unoptimised, that is minutes.
# Overflow checks and debug assertions stay on, so the tests still trap.
[profile.dev.package.px-image]
opt-level = 2

# build-spec §4.2.
[profile.release]
overflow-checks = true   # geometry and length arithmetic must trap, not wrap
lto = "fat"
codegen-units = 1
# Path remapping for invariant 7 is NOT here: Cargo's `trim-paths` profile
# option is still unstable as of 1.98, and this project does not build on
# nightly. `cargo xtask build-and-hash` sets --remap-path-prefix instead, which is
# stable and which knows the actual source and CARGO_HOME paths it must map.
# Move it here the release Cargo stabilises the option.
# Not stripped: cargo-auditable's SBOM lives in a section that stripping can
# remove, and the supply-chain gate asserts that section is present.
strip = false
# panic stays "unwind" here. The broker is the one process that may not die,
# and it wraps IPC dispatch in catch_unwind (§4.3).

# build-spec §14.2, ADR 004. Cargo sets the panic strategy per profile, not per
# crate, so a content process that aborts needs a profile of its own and a
# second build invocation:
#
#   cargo build --profile content-release -p px-content
#
# A content process that dies is contained. One that unwinds through a
# half-mutated DOM is not.
[profile.content-release]
inherits = "release"
panic = "abort"
